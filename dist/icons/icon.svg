<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e14" />
      <stop offset="100%" stop-color="#050608" />
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#7f5af0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" stroke="#1e2433" stroke-width="8" />
  
  <!-- Subtle futuristic grid lines -->
  <circle cx="256" cy="256" r="180" stroke="rgba(255,255,255,0.03)" stroke-width="2" fill="none" />
  <circle cx="256" cy="256" r="130" stroke="rgba(255,255,255,0.05)" stroke-width="2" fill="none" />
  
  <!-- Outer voice ring -->
  <circle cx="256" cy="256" r="160" stroke="url(#neon)" stroke-width="6" stroke-dasharray="16 12" fill="none" opacity="0.6" />

  <!-- Stylized Anonymous Mask / Waveform Core -->
  <g filter="url(#glow)">
    <!-- Sleek eye visor -->
    <path d="M140 230 C 180 200, 332 200, 372 230 C 350 250, 310 255, 256 255 C 202 255, 162 250, 140 230 Z" fill="url(#neon)" opacity="0.9" />
    
    <!-- Waveform bars emerging below visor -->
    <rect x="200" y="290" width="8" height="40" rx="4" fill="url(#neon)" />
    <rect x="224" y="275" width="8" height="70" rx="4" fill="url(#neon)" />
    <rect x="252" y="265" width="8" height="90" rx="4" fill="url(#neon)" />
    <rect x="280" y="275" width="8" height="70" rx="4" fill="url(#neon)" />
    <rect x="304" y="290" width="8" height="40" rx="4" fill="url(#neon)" />
    
    <!-- Top crest node -->
    <circle cx="256" cy="160" r="10" fill="#00f2fe" />
    <line x1="256" y1="170" x2="256" y2="205" stroke="#00f2fe" stroke-width="3" stroke-linecap="round" opacity="0.7" />
  </g>
</svg>
